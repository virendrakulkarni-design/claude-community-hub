name: Alternate-Day Claude Architectural Publisher

on:
  schedule:
    # 03:00 UTC = 8:30 AM IST, every alternate day
    - cron: '0 3 */2 * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publish_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run automated post generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: Commit and Push Updated Knowledge Base
        run: |
          git config --global user.name "Claude Architecture Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-publish: New architectural dispatch [skip ci]"
          git push
